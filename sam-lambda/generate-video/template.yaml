AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  generate-video

  SAM Template for generate-video lambda function

Globals:
  Function:
    Timeout: 900

Resources:
  FFMpegLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ffmpeg-layer
      Description: Layer containing ffmpeg binary
      ContentUri: layer/ffmpeg
      CompatibleRuntimes:
        - python3.10
      LicenseInfo: "MIT"

  GenerateVideoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: generate_video/
      Handler: app.lambda_handler
      Runtime: python3.10
      Architectures:
        - arm64
      MemorySize: 3008
      Environment:
        Variables: 
          BUCKET_NAME: ai-presenter-2-sources-bucket
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Action:
                - "s3:GetObject"
                - "s3:PutObject"
              Resource: 
                - "arn:aws:s3:::ai-presenter-2-sources-bucket/*"
      Layers:
        - !Ref FFMpegLayer

Outputs:
  GenerateVideoFunction:
    Description: "Generate Video Lambda Function ARN"
    Value: !GetAtt GenerateVideoFunction.Arn
  GenerateVideoFunctionIamRole:
    Description: "Implicit IAM Role created for GenerateVideoFunction"
    Value: !GetAtt GenerateVideoFunction.Arn
